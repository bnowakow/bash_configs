services:
  emby:
    image: emby/embyserver:latest
    container_name: emby
    restart: unless-stopped

    devices:
      - /dev/dri:/dev/dri

    user: "${UID}:568"
    group_add:
      - "104"
      - "44"
      - "568"

    volumes:
      - ./config:/config
      - /mnt/PlexPool/plex:/mnt/PlexPool/plex

    ports:
      - "8096:8096"
