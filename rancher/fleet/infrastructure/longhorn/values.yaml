defaultBackupStore:
  backupTarget: nfs://nas.localdomain.bnowakowski.pl:/mnt/MargokPool/archive/Backups/rancher/longhorn

# Allow Longhorn components to run on the etcd-tainted control-plane nodes.
tolerations:
  - key: dedicated
    operator: Equal
    value: etcd
    effect: NoSchedule

defaultSettings:
  # The single remaining node should receive Longhorn's default disk automatically.
  createDefaultDiskLabeledNodes: false
  defaultDataPath: /var/lib/longhorn
  defaultReplicaCount: 2
  taintToleration: dedicated=etcd:NoSchedule
  storageReservedPercentageForDefaultDisk: 10

persistence:
  defaultClass: false
  defaultClassReplicaCount: 1
  reclaimPolicy: Retain
