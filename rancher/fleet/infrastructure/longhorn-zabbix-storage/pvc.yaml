{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "name": "zabbix-postgresql-data-longhorn-rwo",
    "namespace": "apps-zabbix",
    "annotations": {
      "helm.sh/resource-policy": "keep",
      "migration.bnowakowski.pl/source-pvc": "postgresql-data-zabbix-postgresql-0"
    },
    "labels": {
      "recurring-job.longhorn.io/source": "enabled",
      "recurring-job-group.longhorn.io/nas-backup": "enabled"
    }
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "storageClassName": "longhorn-rwo-2replicas",
    "resources": {
      "requests": {
        "storage": "18Gi"
      }
    }
  }
}
