{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "name": "mailpile-path1-longhorn-rwo",
    "namespace": "apps-mailpile",
    "annotations": {
      "helm.sh/resource-policy": "keep",
      "migration.bnowakowski.pl/source-pvc": "mailpile-path1"
    },
    "labels": {
      "recurring-job.longhorn.io/source": "enabled",
      "recurring-job-group.longhorn.io/nas-backup": "enabled"
    }
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "storageClassName": "longhorn-rwo-2replicas",
    "resources": {
      "requests": {
        "storage": "9Gi"
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "name": "mailpile-path2-longhorn-rwo",
    "namespace": "apps-mailpile",
    "annotations": {
      "helm.sh/resource-policy": "keep",
      "migration.bnowakowski.pl/source-pvc": "mailpile-path2"
    },
    "labels": {
      "recurring-job.longhorn.io/source": "enabled",
      "recurring-job-group.longhorn.io/nas-backup": "enabled"
    }
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "storageClassName": "longhorn-rwo-2replicas",
    "resources": {
      "requests": {
        "storage": "256Mi"
      }
    }
  }
}
