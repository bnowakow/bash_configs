apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-config-longhorn-rwo
  namespace: apps-calibre
  annotations:
    helm.sh/resource-policy: keep
    migration.bnowakowski.pl/source-pvc: calibre-config
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/nas-backup: enabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn-rwo-2replicas
  resources:
    requests:
      storage: 256Mi
---
