{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "bookstack-config-longhorn-rwo",
        "namespace": "apps-bookstack",
        "annotations": {
          "helm.sh/resource-policy": "keep",
          "migration.bnowakowski.pl/original-unmounted-pvc": "bookstack-config",
          "migration.bnowakowski.pl/source-kind": "container-layer",
          "migration.bnowakowski.pl/source-path": "/config"
        },
        "labels": {
          "recurring-job.longhorn.io/source": "enabled",
          "recurring-job-group.longhorn.io/nas-backup": "enabled"
        }
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "storageClassName": "longhorn-rwo-2replicas",
        "resources": {
          "requests": {
            "storage": "256Mi"
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "bookstack-mariadb-data-longhorn-rwo",
        "namespace": "apps-bookstack",
        "annotations": {
          "helm.sh/resource-policy": "keep",
          "migration.bnowakowski.pl/source-pvc": "bookstack-mariadb-data"
        },
        "labels": {
          "recurring-job.longhorn.io/source": "enabled",
          "recurring-job-group.longhorn.io/nas-backup": "enabled"
        }
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "storageClassName": "longhorn-rwo-2replicas",
        "resources": {
          "requests": {
            "storage": "1Gi"
          }
        }
      }
    }
  ]
}
