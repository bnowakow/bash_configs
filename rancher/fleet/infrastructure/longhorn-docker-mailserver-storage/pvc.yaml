apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: docker-mailserver-mail-config-longhorn-rwo
      namespace: apps-docker-mailserver
      annotations:
        helm.sh/resource-policy: keep
        migration.bnowakowski.pl/source-pvc: docker-mailserver-mail-config
      labels:
        recurring-job.longhorn.io/source: enabled
        recurring-job-group.longhorn.io/nas-backup: enabled
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: longhorn-rwo-2replicas
      resources:
        requests:
          storage: 256Mi
