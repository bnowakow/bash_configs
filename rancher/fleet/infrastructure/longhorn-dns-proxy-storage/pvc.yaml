apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ddclient-config-longhorn-rwo
  namespace: apps-ddclient
  annotations:
    helm.sh/resource-policy: keep
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/nas-backup: enabled
    migration.bnowakowski.pl/source-pvc: ddclient-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-rwo-2replicas
  resources:
    requests:
      storage: 256Mi
---
