apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filebot-config-longhorn-rwo
  namespace: apps-filebot
  annotations:
    helm.sh/resource-policy: keep
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/nas-backup: enabled
    migration.bnowakowski.pl/source-pvc: filebot-config
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-rwo-2replicas
  resources:
    requests:
      storage: 256Mi
---
