apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openbooks-books-longhorn-rwo
  namespace: apps-openbooks
  annotations:
    helm.sh/resource-policy: keep
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/nas-backup: enabled
    migration.bnowakowski.pl/source-pvc: openbooks-books
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-rwo-2replicas
  resources:
    requests:
      storage: 1Gi
---
