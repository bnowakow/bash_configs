apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-data-longhorn-rwo
  namespace: apps-jenkins
  annotations:
    helm.sh/resource-policy: keep
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/nas-backup: enabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn-rwo-2replicas
  resources:
    requests:
      storage: 10Gi
