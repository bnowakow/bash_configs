{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "name": "sonarr-config-longhorn-rwo",
    "namespace": "apps-sonarr",
    "annotations": {
      "helm.sh/resource-policy": "keep",
      "migration.bnowakowski.pl/source-pvc": "sonarr-config"
    },
    "labels": {
      "recurring-job.longhorn.io/source": "enabled",
      "recurring-job-group.longhorn.io/nas-backup": "enabled"
    }
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "storageClassName": "longhorn-rwo-2replicas",
    "resources": {
      "requests": {
        "storage": "1Gi"
      }
    }
  }
}
