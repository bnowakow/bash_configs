# All Piwigo data lives on encrypted Longhorn volumes:
#   gallery  /gallery: original photos (upload/, galleries/)
#   config   /config: thumbnails and resized copies (www/_data), config, plugins
#   mariadb  the database: titles, tags, EXIF incl. GPS, users
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: piwigo-gallery-longhorn-crypto
  namespace: apps-piwigo
  annotations:
    helm.sh/resource-policy: keep
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/nas-backup: enabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn-crypto-2replicas
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: piwigo-config-longhorn-crypto
  namespace: apps-piwigo
  annotations:
    helm.sh/resource-policy: keep
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/nas-backup: enabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn-crypto-2replicas
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: piwigo-mariadb-data-longhorn-crypto
  namespace: apps-piwigo
  annotations:
    helm.sh/resource-policy: keep
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/nas-backup: enabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn-crypto-2replicas
  resources:
    requests:
      storage: 2Gi
