TZ: Europe/Warsaw

persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: ubooquity-config-longhorn-rwo
    mountPath: /config
  books:
    enabled: true
    type: nfs
    server: nas.localdomain.bnowakowski.pl
    path: /mnt/PlexPool/plex/Books
    mountPath: /books
  comics:
    enabled: false
  files:
    enabled: false

ingress:
  main:
    enabled: true
    primary: true
    annotations:
      helm-upgrade.bnowakowski.pl/check-path: /ubooquity/
    ingressClassName: traefik
    hosts:
      - host: ubooquity.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
      - host: ubooquity.rancher.localdomain.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true
  admin:
    enabled: true
    primary: false
    annotations:
      helm-upgrade.bnowakowski.pl/check-path: /ubooquity/admin
    targetSelector:
      admin: admin
    ingressClassName: traefik
    hosts:
      - host: ubooquity-admin.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
      - host: ubooquity-admin.rancher.localdomain.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true

# One active owner for downloads/logs or the embedded Ubooquity database.
workload:
  main:
    replicas: 1
    strategy: Recreate
