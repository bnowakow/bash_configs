persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: filebot-config-longhorn-rwo
  output:
    enabled: false
    type: pvc
    existingClaim: filebot-output-longhorn-rwo
    mountPath: /output
  storage:
    enabled: true
    path: /mnt/PlexPool/plex
    server: nas.localdomain.bnowakowski.pl
    type: nfs
    mountPath: /storage
  watch:
    enabled: false
    type: pvc
    existingClaim: filebot-watch-longhorn-rwo
    mountPath: /watch

workload:
  main:
    replicas: 0
    strategy: Recreate

ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: filebot.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
      - host: filebot.rancher.localdomain.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true
