persistence:
  data:
    enabled: true
    type: pvc
    existingClaim: jenkins-data-longhorn-rwo
    mountPath: /var/jenkins_home
resources:
  limits:
    cpu: 4000m
    memory: 4Gi
  requests:
    cpu: 50m
    memory: 512Mi
TZ: Europe/Warsaw
metrics:
  main:
    enabled: false
ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
    - host: jenkins.rancher.tailscale.bnowakowski.pl
      paths:
      - path: /
        pathType: Prefix
    - host: jenkins.rancher.localdomain.bnowakowski.pl
      paths:
      - path: /
        pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
        - websecure
        forceTLS: true
# One controller owns JENKINS_HOME; never run two against the same RWO volume.
workload:
  main:
    replicas: 1
    strategy: Recreate
    podSpec:
      # The Kubernetes plugin uses this token to start build-agent pods.
      automountServiceAccountToken: true
# Build agents run as pods in this namespace only (Kubernetes plugin).
serviceAccount:
  main:
    enabled: true
    primary: true
rbac:
  main:
    enabled: true
    primary: true
    clusterWide: false
    rules:
    - apiGroups: [""]
      resources: ["pods", "pods/exec"]
      verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
    - apiGroups: [""]
      resources: ["pods/log", "events"]
      verbs: ["get", "list", "watch"]
