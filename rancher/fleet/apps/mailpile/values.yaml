persistence:
  path1:
    enabled: true
    type: pvc
    existingClaim: mailpile-path1-longhorn-rwo
    mountPath: /root/.local/share/Mailpile
  path2:
    enabled: true
    type: pvc
    existingClaim: mailpile-path2-longhorn-rwo
    mountPath: /root/.gnupg

ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: mailpile.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
      - host: mailpile.rancher.localdomain.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true

# Single owner for mail/index state and GnuPG keyring.
workload:
  main:
    replicas: 1
    strategy: Recreate
