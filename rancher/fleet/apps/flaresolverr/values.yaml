persistence:
  config:
    existingClaim: flaresolverr-config-longhorn-rwo

ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: flaresolverr.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
      - host: flaresolverr.rancher.localdomain.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - web
        forceTLS: false

# Keep browser sessions / DNS updates owned by a single process.
workload:
  main:
    replicas: 1
    strategy: Recreate
