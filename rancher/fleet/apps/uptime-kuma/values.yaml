TZ: Europe/Warsaw

persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: uptime-kuma-config-longhorn-rwo
    mountPath: /app/data

ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: uptime-kuma.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
      - host: uptime-kuma.rancher.localdomain.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true

metrics:
  main:
    enabled: false

# SQLite state has a single application owner.
workload:
  main:
    replicas: 1
    strategy: Recreate
