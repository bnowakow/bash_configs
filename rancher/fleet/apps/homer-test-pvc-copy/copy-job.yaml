apiVersion: batch/v1
kind: Job
metadata:
  name: homer-test-config-copy
  namespace: apps-homer
  labels:
    app.kubernetes.io/part-of: homer-test
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: homer-test
    spec:
      restartPolicy: Never
      containers:
        - name: copy
          image: busybox:1.37
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              cp -a /source/. /target/
              sync
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: target
              mountPath: /target
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: homer-config
        - name: target
          persistentVolumeClaim:
            claimName: homer-test-config

