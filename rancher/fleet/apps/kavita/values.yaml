TZ: Europe/Warsaw

persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: kavita-config-longhorn-rwo
    mountPath: /config
  manga:
    enabled: false
  books:
    enabled: true
    type: nfs
    server: nas.localdomain.bnowakowski.pl
    path: /mnt/PlexPool/plex/Books
    mountPath: /books
  library:
    enabled: true
    type: pvc
    existingClaim: calibre-library-longhorn-rwo
    mountPath: /library
    readOnly: true

ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: kavita.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
      - host: kavita.rancher.localdomain.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true

# Keep all shared-library RWO consumers together.
workload:
  main:
    replicas: 1
    strategy: Recreate
    podSpec:
      nodeSelector:
        kubernetes.io/hostname: proxmox2-old
