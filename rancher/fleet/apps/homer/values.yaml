persistence:
  config:
    enabled: true
    type: pvc
    storageClass: local-path
    size: 1Gi
    mountPath: /www/assets

addons:
  codeserver:
    enabled: true
    ingress:
      enabled: true
      hosts:
        - host: homer-editor.rancher.tailscale.bnowakowski.pl
          paths:
            - path: /
              pathType: Prefix
        - host: homer-editor.rancher.localdomain.bnowakowski.pl
          paths:
            - path: /
              pathType: Prefix
      integrations:
        certManager:
          enabled: true
          certificateIssuer: letsencrypt
        traefik:
          enabled: true
          entrypoints:
            - websecure
          forceTLS: true

ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: homer.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
      - host: homer.rancher.localdomain.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true
