persistence:
  config:
    existingClaim: radarr-config-longhorn-rwo
  plex-nfs-persistence:
    enabled: true
    path: /mnt/PlexPool/plex
    server: nas.localdomain.bnowakowski.pl
    type: nfs
    targetSelector:
      main:
        main:
          mountPath: /mnt/PlexPool/plex

resources:
  limits:
    cpu: 12000m
  requests:
    cpu: 30m

metrics:
  main:
    enabled: false

ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: radarr.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
      - host: radarr.rancher.localdomain.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true

# One instance owns the SQLite databases.
workload:
  main:
    replicas: 1
    strategy: Recreate
    podSpec:
      containers:
        main:
          env:
            # Trust forwarded HTTPS headers from the cluster pod networks used by Traefik.
            RADARR__SERVER__TRUSTEDNETWORKS: "10.42.0.0/24,10.42.2.0/24"
            # Keep login required when forwarded client addresses become trusted.
            RADARR__AUTH__REQUIRED: Enabled
