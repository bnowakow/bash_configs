TZ: Europe/Warsaw

persistence:
  books:
    enabled: true
    type: pvc
    existingClaim: openbooks-books-longhorn-rwo
    mountPath: /books/books
  logs:
    enabled: true
    type: pvc
    existingClaim: openbooks-logs-longhorn-rwo
    mountPath: /books/logs

ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: openbooks.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
      - host: openbooks.rancher.localdomain.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true

# One active owner for downloads/logs or the embedded Ubooquity database.
workload:
  main:
    replicas: 1
    strategy: Recreate
