TZ: Europe/Warsaw

persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: calibre-web-config-longhorn-rwo
    mountPath: /config
  books:
    enabled: true
    type: nfs
    server: nas.localdomain.bnowakowski.pl
    path: /mnt/PlexPool/plex/Books
    mountPath: /books
  library:
    enabled: true
    type: pvc
    existingClaim: calibre-library-longhorn-rwo
    mountPath: /library
    readOnly: true

ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: calibre-web.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
      - host: calibre-web.rancher.localdomain.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true

workload:
  main:
    replicas: 1
    strategy: Recreate
    podSpec:
      nodeSelector:
        kubernetes.io/hostname: proxmox2-old
      containers:
        main:
          env:
            CACHE_DIRECTORY: /config/thumbnail-cache
