# Create the configuration PVC so CloudCasa can restore into it before startup.
persistence:
  config:
    enabled: true

workload:
  main:
    replicas: 0
    podSpec:
      containers:
        main:
          env:
            APP_URL: https://bookstack.rancher.tailscale.bnowakowski.pl/

ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: bookstack.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true
