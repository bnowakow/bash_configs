# Create the configuration PVC so CloudCasa can restore into it before startup.
persistence:
  config:
    enabled: true

# Keep the MariaDB data mount tied to the PVC restored by CloudCasa.
mariadb:
  workload:
    main:
      replicas: 1
  persistence:
    data:
      enabled: true
      type: pvc
      existingClaim: bookstack-mariadb-data

workload:
  main:
    replicas: 1
    podSpec:
      containers:
        main:
          env:
            APP_URL: https://bookstack.rancher.tailscale.bnowakowski.pl/

ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: bookstack.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true
