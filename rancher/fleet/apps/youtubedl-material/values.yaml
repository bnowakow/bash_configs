persistence:
  appdata:
    enabled: true
    mountPath: /app/appdata
  audio:
    enabled: true
    mountPath: /app/audio
    path: /mnt/MargokPool/archive/Data/rancher/youtubedl-material/audio
    server: nas.localdomain.bnowakowski.pl
    type: nfs
  subscriptions:
    enabled: true
    mountPath: /app/subscriptions
    path: /mnt/MargokPool/archive/Data/rancher/youtubedl-material/subscriptions
    server: nas.localdomain.bnowakowski.pl
    type: nfs
  users:
    enabled: true
    mountPath: /app/users
  video:
    enabled: true
    mountPath: /app/video
    path: /mnt/MargokPool/archive/Data/rancher/youtubedl-material/video
    server: nas.localdomain.bnowakowski.pl
    type: nfs

resources:
  limits:
    cpu: 200m
    memory: 14Gi
  requests:
    cpu: 60m
    memory: 4Gi

workload:
  main:
    podSpec:
      containers:
        main:
          fixedEnv:
            PUID: "568"
          probes:
            startup:
              enabled: true
              spec:
                initialDelaySeconds: 30
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 180
                successThreshold: 1
            liveness:
              enabled: true
              spec:
                initialDelaySeconds: 60
                periodSeconds: 30
                timeoutSeconds: 5
                failureThreshold: 5
                successThreshold: 1

security:
  PUID: 568

securityContext:
  container:
    fsGroup: 568
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
    readOnlyRootFilesystem: false
