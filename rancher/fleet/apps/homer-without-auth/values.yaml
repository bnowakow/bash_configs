persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: homer-without-auth-config-longhorn-rwo
    mountPath: /www/assets

addons:
  codeserver:
    enabled: true
    ingress:
      enabled: true
      hosts:
        - host: homer-without-auth-editor.rancher.tailscale.bnowakowski.pl
          paths:
            - path: /
              pathType: Prefix
        - host: homer-without-auth-editor.rancher.localdomain.bnowakowski.pl
          paths:
            - path: /
              pathType: Prefix
      integrations:
        certManager:
          enabled: true
          certificateIssuer: letsencrypt
        traefik:
          enabled: true
          entrypoints:
            - websecure
          forceTLS: true

ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: homer-without-auth.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
      - host: homer-without-auth.rancher.localdomain.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true

# RWO permits same-node sharing; both editors and the copy job must co-locate.
podOptions:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values: [homer, homer-without-auth]
          topologyKey: kubernetes.io/hostname
