ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: scrutiny.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
      - host: scrutiny.rancher.localdomain.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true

# Move both state volumes together; preserve the hardware collector's host.
persistence:
  config:
    existingClaim: scrutiny-config-longhorn-rwo
  influxdb:
    existingClaim: scrutiny-influxdb-longhorn-rwo
workload:
  main:
    replicas: 1
    strategy: Recreate
    podSpec:
      nodeSelector:
        kubernetes.io/hostname: proxmox3
