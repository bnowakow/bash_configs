persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: duckdns-config-longhorn-rwo

workload:
  main:
    replicas: 1
    strategy: Recreate
    podSpec:
      containers:
        main:
          env:
            LOG_FILE: false
            SUBDOMAINS: rancher-sup.duckdns.org
          probes:
            liveness:
              enabled: false
            readiness:
              enabled: false
            startup:
              enabled: false
