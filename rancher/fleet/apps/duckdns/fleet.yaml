name: duckdns
defaultNamespace: apps-duckdns

dependsOn:
  - name: longhorn-dns-proxy-storage

helm:
  chart: oci://oci.trueforge.org/truecharts/duckdns
  version: 14.0.6
  releaseName: duckdns
  waitForJobs: true
  valuesFiles:
    - values.yaml
  valuesFrom:
    - secretKeyRef:
        name: duckdns-values
        key: values.yaml
