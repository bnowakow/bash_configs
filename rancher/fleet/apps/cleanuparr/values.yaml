application:
  port: 11011
  urlBase: ''

deployment:
  strategy:
    type: Recreate
  container:
    env:
      - name: PGID
        value: "1000"
      - name: PUID
        value: "1000"
    volumeMounts:
      - name: config
        mountPath: /config
  volumes:
    config:
      persistentVolumeClaim:
        claimName: cleanuparr-config-longhorn-rwo

# Target PVC is owned by the storage Fleet bundle, not this chart.
persistentVolumeClaims: null

ingress:
  enabled: true
  className: traefik
  host: cleanuparr.rancher.tailscale.bnowakowski.pl
  path: /
  pathType: Prefix
  tls:
    - secretName: cleanuparr-tailscale-tls
      hosts:
        - cleanuparr.rancher.tailscale.bnowakowski.pl
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
