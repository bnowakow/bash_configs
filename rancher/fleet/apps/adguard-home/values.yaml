service:
  dns-tcp:
    enabled: true
    type: LoadBalancer
    ports:
      dns-tcp:
        enabled: true
        port: 53
        protocol: tcp
        targetPort: 53
  dns-udp:
    enabled: true
    type: LoadBalancer
    ports:
      dns-udp:
        enabled: true
        port: 53
        protocol: udp
        targetPort: 53

persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: adguard-home-config-longhorn-rwo
    mountPath: /opt/adguardhome/conf
  data:
    enabled: true
    type: pvc
    existingClaim: adguard-home-data-longhorn-rwo
    mountPath: /opt/adguardhome/work

ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: adguard-home.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
      - host: adguard-home.rancher.localdomain.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true

# One instance owns bbolt/config/query state; preserve the DNS host during cutover.
workload:
  main:
    replicas: 1
    strategy: Recreate
    podSpec:
      nodeSelector:
        kubernetes.io/hostname: proxmox3
