persistence:
  config:
    enabled: true
    type: pvc
    existingClaim: audiobookshelf-config-longhorn-rwo
    mountPath: /config
  metadata:
    enabled: true
    type: pvc
    existingClaim: audiobookshelf-metadata-longhorn-rwo
    mountPath: /metadata
  audiobooks:
    enabled: true
    type: nfs
    server: nas.localdomain.bnowakowski.pl
    path: /mnt/PlexPool/plex/Audiobooks
    mountPath: /audiobooks
  audiobooks-for-kids:
    enabled: true
    type: nfs
    server: nas.localdomain.bnowakowski.pl
    path: /mnt/PlexPool/plex/Audiobooks-for-Kids
    mountPath: /audiobooks-for-kids

ingress:
  main:
    enabled: true
    primary: true
    ingressClassName: traefik
    hosts:
      - host: audiobookshelf.rancher.tailscale.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
      - host: audiobookshelf.rancher.localdomain.bnowakowski.pl
        paths:
          - path: /
            pathType: Prefix
    integrations:
      certManager:
        enabled: true
        certificateIssuer: letsencrypt
      traefik:
        enabled: true
        entrypoints:
          - websecure
        forceTLS: true

# SQLite and metadata are owned by one instance.
workload:
  main:
    replicas: 1
    strategy: Recreate
