# The chart mounts this TLS Secret and sets SSL_TYPE=manual and the certificate paths.
certificate: docker-mailserver-tls

extraDeploy:
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: docker-mailserver
    spec:
      secretName: docker-mailserver-tls
      issuerRef:
        kind: ClusterIssuer
        name: letsencrypt
      dnsNames:
        - mailserver.rancher.localdomain.bnowakowski.pl
        - mailserver.rancher.tailscale.bnowakowski.pl

deployment:
  replicas: 1
  env:
    OVERRIDE_HOSTNAME: mailserver.rancher.tailscale.bnowakowski.pl

service:
  type: LoadBalancer
  externalTrafficPolicy: Local

# Reuse the PVC names from the former Helm deployment.
persistent_volume_claims:
  mail-config:
    enabled: true
    existingClaim: docker-mailserver-mail-config
  mail-data:
    enabled: true
    existingClaim: docker-mailserver-mail-data
  mail-state:
    enabled: true
    existingClaim: docker-mailserver-mail-state
  mail-log:
    enabled: true
    existingClaim: docker-mailserver-mail-log
