  dns-udp:
    enabled: true
    type: LoadBalancer
    ports:
      dns-udp:
        enabled: true
        port: 53
        protocol: udp
        targetPort: 53


persistence:
  config:
    enabled: true
    type: pvc
    storageClass: local-path
    size: 100Mi
    existingClaim: adguard-home-config
    mountPath: /opt/adguardhome/conf
  data:
    enabled: true
    type: pvc
    storageClass: local-path
    size: 10Gi
    existingClaim: adguard-home-data
    mountPath: /opt/adguardhome/work
