  dns-udp:
    enabled: true
    type: LoadBalancer
    loadBalancerClass: kube-vip
    annotations:
      kube-vip.io/loadbalancerIPs: 10.0.0.53
    ports:
      dns-udp:
        enabled: true
        port: 53
        protocol: udp
        targetPort: 53


persistence:
  config:
    enabled: true
    mountPath: /opt/adguardhome/conf
    existingClaim: adguard-home-config-longhorn
    type: pvc
  data:
    enabled: true
    mountPath: /opt/adguardhome/work
    existingClaim: adguard-home-data-longhorn
    type: pvc
