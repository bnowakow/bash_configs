apiVersion: v1
kind: Pod
metadata:
  name: homer-test-rwx-transfer
  namespace: apps-homer-test
spec:
  restartPolicy: Never
  containers:
    - name: transfer
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: target
          mountPath: /target
  volumes:
    - name: target
      persistentVolumeClaim:
        claimName: homer-test-config-longhorn-rwx

