apiVersion: v1
kind: Pod
metadata:
  name: homer-test-rwo-transfer
  namespace: apps-homer-test
spec:
  restartPolicy: Never
  containers:
    - name: transfer
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: source
          mountPath: /source
          readOnly: true
  volumes:
    - name: source
      persistentVolumeClaim:
        claimName: homer-test-config-longhorn

