name: emby

x-emby-common: &emby-common
  image: emby/embyserver:latest
  restart: unless-stopped
  # Reduce selection priority during host-wide OOM; keep killing enabled so
  # the host can still recover if memory is exhausted.
  oom_score_adj: -300
  devices:
    - /dev/dri:/dev/dri
  environment: &emby-environment
    # The official image needs root initialization before dropping privileges.
    UID: "568"
    GID: "568"
    GIDLIST: "44,104,568,65534"

# Fails when the media share is missing or hung, instead of Emby silently
# serving empty libraries. Docker does not restart unhealthy containers; this
# surfaces the problem in `docker compose ps` and makes upgrade.sh --wait fail.
x-media-healthcheck: &media-healthcheck
  interval: 60s
  timeout: 10s
  retries: 3
  start_period: 60s
  start_interval: 5s

services:
  emby:
    <<: *emby-common
    container_name: emby
    volumes:
      - ./config:/config
      # Docker mounts this NFS volume at container start. A host bind mount of
      # the fstab mount raced it at boot and captured the empty local
      # directory (see NFS-incident.md).
      - plex:/mnt/PlexPool/plex
    healthcheck:
      <<: *media-healthcheck
      test: ["CMD", "test", "-d", "/mnt/PlexPool/plex/Movies"]
    ports:
      - "8096:8096"

  nubile:
    <<: *emby-common
    container_name: nubile
    environment:
      <<: *emby-environment
      # NAS Movies is owned by group 1000 with mode 770.
      GIDLIST: "44,104,568,1000,65534"
    volumes:
      - ./nubile-config:/config
      - movies:/mnt/MargokPool/archive/Movies
    healthcheck:
      <<: *media-healthcheck
      test: ["CMD", "test", "-d", "/mnt/MargokPool/archive/Movies/nubile"]
    ports:
      - "8097:8096"

volumes:
  plex:
    driver: local
    driver_opts:
      type: nfs
      o: addr=nas.localdomain.bnowakowski.pl,rw,nfsvers=4.2
      device: :/mnt/PlexPool/plex
  movies:
    # Preserve the existing Docker-managed NFS volume during project migration.
    external: true
    name: nubile_movies
