- hosts: all
  gather_facts: false

  pre_tasks:
    - name: Refuse the NAS-local inventory for VM setup
      ansible.builtin.assert:
        that: not (nas_local_inventory | default(false) | bool)
        fail_msg: This playbook must not run with inventory/nas-local.yml.
      become: false
      tags: always

    - name: Gather facts after the inventory safeguard
      ansible.builtin.setup:
      tags: always

  handlers:
    - name: Reconnect after changing sup's primary group
      ansible.builtin.meta: reset_connection

  tasks:
    - name: Add authorized key from id_ecdsa.pub file
      authorized_key:
        user: sup
        state: present
        key: "{{ lookup('file', '/mnt/MargokPool/home/sup/.ssh/id_ecdsa.pub') }}"
      tags: ssh_keys

    - name: Add additional authorized SSH keys for sup
      ansible.posix.authorized_key:
        user: sup
        state: present
        key: "{{ item }}"
      loop: "{{ sup_extra_authorized_keys | default([]) }}"
      tags: ssh_keys

    - name: install packages
      apt:
        name:
          - apt-transport-https
          - bubblewrap
          - ca-certificates
          - curl
          - dirmngr
          - git
          - htop
          - jq
          - ncdu
          - nfs-common
          - nodejs
          - npm
          - openssh-client
          - ripgrep
          - screen
          - vim
          - zsh
        state: present
        update_cache: true
      become: true

    - name: Check whether software-properties-common is available
      ansible.builtin.command: apt-cache show software-properties-common
      register: software_properties_package
      changed_when: false
      failed_when: false

    - name: Install software-properties-common when available
      ansible.builtin.apt:
        name: software-properties-common
        state: present
      become: true
      when: software_properties_package.rc == 0

    - name: Find sup's home directory
      ansible.builtin.getent:
        database: passwd
        key: sup
      tags: sup_primary_group

    - name: Give sup the standard primary group on proxmox2-old
      ansible.builtin.user:
        name: sup
        group: sup
        groups: docker
        append: true
      become: true
      when: inventory_hostname == 'proxmox2-old.localdomain.bnowakowski.pl'
      notify: Reconnect after changing sup's primary group
      tags: sup_primary_group

    - name: Apply sup's new group membership to the current connection
      ansible.builtin.meta: flush_handlers
      tags: sup_primary_group

    - name: Give sup's home directory the standard group on proxmox2-old
      ansible.builtin.file:
        path: "{{ ansible_facts.getent_passwd['sup'][4] }}"
        state: directory
        owner: sup
        group: sup
      become: true
      when: inventory_hostname == 'proxmox2-old.localdomain.bnowakowski.pl'
      tags: sup_primary_group

    - name: Configure sup's npm global prefix
      ansible.builtin.lineinfile:
        path: "{{ ansible_facts.getent_passwd['sup'][4] }}/.npmrc"
        regexp: '^prefix\s*='
        line: "prefix={{ ansible_facts.getent_passwd['sup'][4] }}/.local"
        create: true
        owner: sup
        group: sup
        mode: '0600'
      become: true

    - name: Check sup's zshenv path
      ansible.builtin.stat:
        path: "{{ ansible_facts.getent_passwd['sup'][4] }}/.zshenv"
        follow: false
      register: sup_zshenv

    - name: Refuse to replace an unrelated zshenv symlink
      ansible.builtin.assert:
        that:
          - not (sup_zshenv.stat.islnk | default(false)) or sup_zshenv.stat.lnk_source == ansible_facts.getent_passwd['sup'][4] ~ '/.zprezto/runcoms/zshenv'
        fail_msg: "{{ ansible_facts.getent_passwd['sup'][4] }}/.zshenv points outside Prezto. Review it before changing sup's PATH."

    - name: Remove the zshenv symlink into Prezto
      ansible.builtin.file:
        path: "{{ ansible_facts.getent_passwd['sup'][4] }}/.zshenv"
        state: absent
      when: sup_zshenv.stat.islnk | default(false)
      become: true

    - name: Load Prezto from sup's independent zshenv
      ansible.builtin.copy:
        dest: "{{ ansible_facts.getent_passwd['sup'][4] }}/.zshenv"
        content: |
          if [[ -r "$HOME/.zprezto/runcoms/zshenv" ]]; then
            source "$HOME/.zprezto/runcoms/zshenv"
          fi
        owner: sup
        group: sup
        mode: '0644'
      when: sup_zshenv.stat.islnk | default(false)
      become: true

    - name: Put sup's local executables first in zsh
      ansible.builtin.blockinfile:
        path: "{{ ansible_facts.getent_passwd['sup'][4] }}/.zshenv"
        block: 'export PATH="$HOME/.local/bin:$PATH"'
        create: true
        owner: sup
        group: sup
        mode: '0644'
      become: true

    - name: Check sup's Codex CLI
      ansible.builtin.command: "{{ ansible_facts.getent_passwd['sup'][4] }}/.local/bin/codex --version"
      register: codex_cli_version
      changed_when: false
      failed_when: false
      become: false

    - name: Install Codex CLI for sup
      ansible.builtin.command: npm install -g @openai/codex
      when: codex_cli_version.rc != 0
      become: false

    - name: Verify sup's Codex CLI
      ansible.builtin.command: "{{ ansible_facts.getent_passwd['sup'][4] }}/.local/bin/codex --version"
      changed_when: false
      become: false
