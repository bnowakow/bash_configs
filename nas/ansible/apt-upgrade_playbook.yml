---
- name: Plan apt upgrades before asking about NordVPN
  hosts: all
  become: true
  become_method: sudo
  gather_facts: false
  pre_tasks:
    - name: Check that this is not NAS
      ansible.builtin.import_tasks: apt-upgrade-guard_tasks.yml
      become: false
      tags: always

  tasks:
    - name: Refresh package lists before planning the upgrade
      ansible.builtin.apt:
        update_cache: true

    - name: Simulate the dist-upgrade
      ansible.builtin.command:
        argv: [apt-get, -s, --no-remove, dist-upgrade]
      register: apt_upgrade_plan
      changed_when: false
      check_mode: false

    - name: Identify a planned NordVPN update
      ansible.builtin.set_fact:
        nordvpn_upgrade_planned: "{{ apt_upgrade_plan.stdout is search('(?m)^Inst nordvpn ') }}"

    - name: Check whether NordVPN is installed
      ansible.builtin.command:
        argv: [dpkg-query, -W, '-f=${Status}', nordvpn]
      register: nordvpn_package_status
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Record whether NordVPN is installed
      ansible.builtin.set_fact:
        nordvpn_installed: "{{ nordvpn_package_status.stdout | trim == 'install ok installed' }}"

- name: Approve NordVPN reboots before upgrading
  hosts: all
  serial: 1
  gather_facts: false
  tasks:
    - name: Ask before upgrading NordVPN and rebooting this host
      ansible.builtin.pause:
        prompt: >-
          {{ lookup('ansible.builtin.env', 'APT_UPGRADE_HOST_COLOR') }}{{ inventory_hostname }}{{ lookup('ansible.builtin.env', 'APT_UPGRADE_HOST_RESET') }} will upgrade NordVPN.
          The VPN kill switch may disconnect Ansible during the upgrade.
          May apt upgrade this host and immediately reboot it on success? [yes/no]
      register: nordvpn_reboot_confirmation
      when:
        - nordvpn_upgrade_planned
        - not ansible_check_mode

    - name: Record declined NordVPN upgrades
      ansible.builtin.set_fact:
        apt_upgrade_declined: >-
          {{ nordvpn_upgrade_planned and not ansible_check_mode and
             (nordvpn_reboot_confirmation.user_input | default('') | trim | lower) not in ['yes', 'y'] }}

    - name: Save declined hosts for the shell wrapper
      ansible.builtin.lineinfile:
        path: "{{ lookup('ansible.builtin.env', 'APT_UPGRADE_SKIPPED_HOSTS_FILE') }}"
        line: "{{ inventory_hostname }}"
        mode: '0600'
      delegate_to: localhost
      become: false
      when:
        - apt_upgrade_declined
        - lookup('ansible.builtin.env', 'APT_UPGRADE_SKIPPED_HOSTS_FILE') | length > 0

    - name: Report that this host will not be upgraded
      ansible.builtin.debug:
        msg: Skipping all upgrades on {{ inventory_hostname }} because the NordVPN reboot was declined.
      when: apt_upgrade_declined

- name: Upgrade apt packages and firmware
  hosts: all
  become: true
  become_method: sudo
  gather_facts: false
  pre_tasks:
    - name: Skip hosts whose NordVPN reboot was declined
      ansible.builtin.meta: end_host
      when: apt_upgrade_declined | default(false)

    - name: Check that this is not NAS
      ansible.builtin.import_tasks: apt-upgrade-guard_tasks.yml
      become: false
      tags: always

  tasks:
    - name: Read NordVPN auto-connect setting before upgrading
      ansible.builtin.command: nordvpn settings
      become: false
      register: nordvpn_settings_before_upgrade
      changed_when: false
      when:
        - nordvpn_installed or nordvpn_upgrade_planned
        - not ansible_check_mode

    - name: Enable NordVPN auto-connect before upgrading
      ansible.builtin.command: nordvpn set autoconnect on
      become: false
      when:
        - nordvpn_installed or nordvpn_upgrade_planned
        - not ansible_check_mode
        - "nordvpn_settings_before_upgrade.stdout is not search('(?m)^Auto-connect: enabled')"

    - name: Verify NordVPN auto-connect is enabled before upgrading
      ansible.builtin.command: nordvpn settings
      become: false
      register: nordvpn_settings_for_reboot
      changed_when: false
      when:
        - nordvpn_installed or nordvpn_upgrade_planned
        - not ansible_check_mode

    - name: Refuse upgrade of a NordVPN host without auto-connect
      ansible.builtin.assert:
        that: "nordvpn_settings_for_reboot.stdout is search('(?m)^Auto-connect: enabled')"
        fail_msg: NordVPN auto-connect is not enabled; this host was not upgraded.
      when:
        - nordvpn_installed or nordvpn_upgrade_planned
        - not ansible_check_mode

    - name: Upgrade NordVPN and reboot in one remote command
      ansible.builtin.reboot:
        reboot_command: >-
          /usr/bin/systemd-run --unit=apt-upgrade-nordvpn --collect --property=Type=exec
          /bin/sh -c 'umask 077; DEBIAN_FRONTEND=noninteractive /usr/bin/apt-get -y --no-remove
          -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold
          dist-upgrade > /var/log/apt-upgrade-nordvpn.log 2>&1 && /usr/sbin/reboot'
        reboot_timeout: 1800
        post_reboot_delay: 15
      when:
        - nordvpn_upgrade_planned
        - not ansible_check_mode

    - name: Confirm NordVPN reconnects after reboot
      ansible.builtin.command: nordvpn status
      become: false
      register: nordvpn_status_after_reboot
      changed_when: false
      until: "nordvpn_status_after_reboot.stdout is search('(?m)^Status: Connected')"
      retries: 18
      delay: 10
      when:
        - nordvpn_upgrade_planned
        - not ansible_check_mode

    - name: Read the NordVPN upgrade output after reboot
      ansible.builtin.command:
        argv: [tail, -n, '100', /var/log/apt-upgrade-nordvpn.log]
      register: nordvpn_upgrade_output
      changed_when: false
      when:
        - nordvpn_upgrade_planned
        - not ansible_check_mode

    - name: Include NordVPN upgrade output in the package summary
      ansible.builtin.set_fact:
        apt_package_changes:
          stdout: "{{ nordvpn_upgrade_output.stdout }}"
      when:
        - nordvpn_upgrade_planned
        - not ansible_check_mode

    - name: Update package lists and perform the Proxmox-recommended dist-upgrade
      block:
        - name: Run dist-upgrade
          ansible.builtin.apt:
            upgrade: dist
            force_apt_get: true
            fail_on_autoremove: true
          environment:
            DEBIAN_FRONTEND: noninteractive
          register: apt_package_changes
      rescue:
        - name: Stop if the upgrade failed for a reason other than a missing package on the mirror
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('The dist-upgrade failed without an error message.') }}"
          when: (ansible_failed_result.msg | default('')) is not search('404\s+Not Found')

        - name: Refresh package lists without HTTP cache after a mirror 404
          ansible.builtin.command:
            argv:
              - apt-get
              - -o
              - Acquire::http::No-Cache=true
              - update

        - name: Check the new apt plan after refreshing the mirror
          ansible.builtin.command:
            argv: [apt-get, -s, --no-remove, dist-upgrade]
          register: refreshed_apt_upgrade_plan
          changed_when: false
          check_mode: false

        - name: Refuse an unapproved NordVPN update after a mirror refresh
          ansible.builtin.assert:
            that: refreshed_apt_upgrade_plan.stdout is not search('(?m)^Inst nordvpn ')
            fail_msg: The mirror refresh added a NordVPN update; rerun apt-upgrade.sh to approve a reboot before upgrading.

        - name: Retry dist-upgrade after refreshing the package lists
          ansible.builtin.apt:
            upgrade: dist
            force_apt_get: true
            fail_on_autoremove: true
          environment:
            DEBIAN_FRONTEND: noninteractive
          register: apt_package_changes
      when: not nordvpn_upgrade_planned or ansible_check_mode

    - name: Remove unused packages only when explicitly requested
      ansible.builtin.apt:
        autoremove: true
      when: run_apt_autoremove | default(false) | bool

    - name: Check whether fwupdmgr is installed
      ansible.builtin.stat:
        path: /usr/bin/fwupdmgr
      register: fwupdmgr_check

    - name: Update firmware only when explicitly requested
      ansible.builtin.command: /usr/bin/fwupdmgr update --assume-yes --no-reboot-check
      when:
        - fwupdmgr_check.stat.executable | default(false)
        - run_firmware_update | default(false) | bool
        - not ansible_check_mode

- name: Check reboot requirements and reboot hosts sequentially
  hosts: all
  serial: 1
  become: true
  become_method: sudo
  gather_facts: false
  pre_tasks:
    - name: Skip hosts whose NordVPN reboot was declined
      ansible.builtin.meta: end_host
      when: apt_upgrade_declined | default(false)

    - name: Check that this is not NAS
      ansible.builtin.import_tasks: apt-upgrade-guard_tasks.yml
      become: false
      tags: always

  tasks:
    - name: Check that the kernel status script exists
      ansible.builtin.stat:
        path: /home/sup/code/bash_configs/proxmox/zabbix/is-proxmox-kernel-up-to-date.sh
      register: kernel_status_script

    - name: Decide whether the kernel check applies
      ansible.builtin.set_fact:
        kernel_check_available: >-
          {{ (run_kernel_reboot_check | default(true) | bool)
             and kernel_status_script.stat.executable | default(false) }}

    - name: Require the kernel check script when enabled
      ansible.builtin.assert:
        that: kernel_status_script.stat.executable | default(false)
        fail_msg: The kernel reboot check is enabled, but its script is missing or not executable.
      when: run_kernel_reboot_check | default(true) | bool

    - name: Report hosts without an applicable kernel check
      ansible.builtin.debug:
        msg: Skipping the kernel reboot check on {{ inventory_hostname }}.
      when: not kernel_check_available

    - name: Check whether the running kernel is up to date
      ansible.builtin.command: /home/sup/code/bash_configs/proxmox/zabbix/is-proxmox-kernel-up-to-date.sh
      register: kernel_status_before_reboot
      changed_when: false
      check_mode: false
      when: kernel_check_available

    - name: Require a usable kernel check result
      ansible.builtin.assert:
        that: >-
          kernel_status_before_reboot.stdout | trim == 'true' or
          (kernel_status_before_reboot.stdout | trim) is match('^false,[^,]+,[^,]+$')
        fail_msg: The kernel check could not identify both the running and installed kernels.
      when: kernel_check_available

    - name: Show reboot requirement in check mode
      ansible.builtin.debug:
        msg: >-
          Kernel check returned {{ kernel_status_before_reboot.stdout | trim | default('no output', true) }};
          a real run will ask before rebooting if this is not true.
      when:
        - kernel_check_available
        - ansible_check_mode

    - name: Ask whether this host may be rebooted
      ansible.builtin.pause:
        prompt: >-
          {{ lookup('ansible.builtin.env', 'APT_UPGRADE_HOST_COLOR') }}{{ inventory_hostname }}{{ lookup('ansible.builtin.env', 'APT_UPGRADE_HOST_RESET') }} needs a reboot to activate its newer kernel
          (kernel check returned {{ kernel_status_before_reboot.stdout | trim | default('no output', true) }}).
          Continue with reboot on this host? [yes/no]
      register: reboot_confirmation
      when:
        - kernel_check_available
        - not ansible_check_mode
        - kernel_status_before_reboot.stdout | trim != 'true'

    - name: Reboot host to activate the newer kernel
      ansible.builtin.reboot:
        msg: Rebooting to activate the newly installed kernel
        reboot_timeout: 900
      when:
        - kernel_check_available
        - not ansible_check_mode
        - kernel_status_before_reboot.stdout | trim != 'true'
        - reboot_confirmation.user_input | lower in ['yes', 'y']

    - name: Check kernel status after reboot
      ansible.builtin.command: /home/sup/code/bash_configs/proxmox/zabbix/is-proxmox-kernel-up-to-date.sh
      register: kernel_status_after_reboot
      changed_when: false
      failed_when: false
      until: kernel_status_after_reboot.stdout | trim == 'true'
      retries: 30
      delay: 10
      when:
        - kernel_check_available
        - not ansible_check_mode
        - kernel_status_before_reboot.stdout | trim != 'true'
        - reboot_confirmation.user_input | lower in ['yes', 'y']

    - name: Confirm NordVPN reconnects after a kernel reboot
      ansible.builtin.command: nordvpn status
      become: false
      register: nordvpn_status_after_kernel_reboot
      changed_when: false
      until: "nordvpn_status_after_kernel_reboot.stdout is search('(?m)^Status: Connected')"
      retries: 18
      delay: 10
      when:
        - nordvpn_installed
        - kernel_check_available
        - not ansible_check_mode
        - kernel_status_before_reboot.stdout | trim != 'true'
        - reboot_confirmation.user_input | lower in ['yes', 'y']

    - name: Fail if the newer kernel is still not active
      ansible.builtin.assert:
        that:
          - kernel_status_after_reboot.stdout | trim == 'true'
        fail_msg: >-
          {{ inventory_hostname }} rebooted, but the kernel status check did not
          return true after waiting for it.
      when:
        - kernel_check_available
        - not ansible_check_mode
        - kernel_status_before_reboot.stdout | trim != 'true'
        - reboot_confirmation.user_input | lower in ['yes', 'y']

    - name: Report that reboot was declined
      ansible.builtin.debug:
        msg: Reboot declined for {{ inventory_hostname }}; the newer kernel remains inactive.
      when:
        - kernel_check_available
        - not ansible_check_mode
        - kernel_status_before_reboot.stdout | trim != 'true'
        - reboot_confirmation.user_input | lower not in ['yes', 'y']

- name: Show package changes summary
  hosts: all
  gather_facts: false
  pre_tasks:
    - name: Skip hosts whose NordVPN reboot was declined
      ansible.builtin.meta: end_host
      when: apt_upgrade_declined | default(false)

    - name: Check that this is not NAS
      ansible.builtin.import_tasks: apt-upgrade-guard_tasks.yml
      tags: always

  tasks:
    - name: Show package changes for this host
      ansible.builtin.debug:
        msg: |-
          Package changes on {{ inventory_hostname }}:
          {{ apt_package_changes.stdout | default('No package changes.') | trim }}
