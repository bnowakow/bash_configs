---
- hosts: all
  become: no
  gather_facts: false
  pre_tasks:
    - name: Refuse the NAS-local inventory for VM setup
      ansible.builtin.assert:
        that: not (nas_local_inventory | default(false) | bool)
        fail_msg: This playbook must not run with inventory/nas-local.yml.
      tags: always

    - name: Gather facts after the inventory safeguard
      ansible.builtin.setup:
      tags: always

  tasks:
    - name: Install GitHub SSH settings
      ansible.builtin.include_tasks: github-ssh_tasks.yml
    - name: setup git name
      git_config:
        name: user.name
        scope: global
        value: "Bartek Dobrowolski-Nowakowski"
    - name: setup git user email
      git_config:
        name: user.email
        scope: global
        value: dobrowolski.nowakowski@gmail.com
    - name: install GitHub SSH private key
      ansible.builtin.copy:
        src: "{{ github_ssh_private_key_source }}"
        dest: "{{ ansible_env.HOME }}/.ssh/id_ecdsa"
        mode: "0600"
      when: github_ssh_private_key_source is defined
      no_log: true
    - name: Check whether bash_configs is already cloned
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/code/bash_configs/.git"
      register: bash_configs_git_dir

    - name: Check the existing checkout for local changes
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ ansible_env.HOME }}/code/bash_configs"
          - status
          - --porcelain
      register: bash_configs_status
      changed_when: false
      check_mode: false
      when: bash_configs_git_dir.stat.exists

    - name: Explain why the existing checkout will not be updated
      ansible.builtin.debug:
        msg: "Skipping bash_configs update: this host has local Git changes."
      when:
        - bash_configs_git_dir.stat.exists
        - (bash_configs_status.stdout | default('')) != ''

    - name: clone bash_configs repository
      git:
        repo: git@github.com:bnowakow/bash_configs.git
        dest: ~/code/bash_configs/
        clone: yes
        update: yes
      when: not bash_configs_git_dir.stat.exists or (bash_configs_status.stdout | default('')) == ''
