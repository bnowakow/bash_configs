---
- hosts: all
  become: no
  gather_facts: false
  pre_tasks:
    - name: Refuse the NAS-local inventory for VM setup
      ansible.builtin.assert:
        that: not (nas_local_inventory | default(false) | bool)
        fail_msg: This playbook must not run with inventory/nas-local.yml.
      tags: always

    - name: Gather facts after the inventory safeguard
      ansible.builtin.setup:
      tags: always

  tasks:
    - name: Install GitHub SSH settings
      ansible.builtin.include_tasks: github-ssh_tasks.yml
    - name: setup git name
      git_config:
        name: user.name
        scope: global
        value: "Bartek Dobrowolski-Nowakowski"
    - name: setup git user email
      git_config:
        name: user.email
        scope: global
        value: dobrowolski.nowakowski@gmail.com
    - name: Check whether homelab is already cloned
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/code/homelab/.git"
      register: homelab_git_dir

    - name: Check the existing checkout for local changes
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ ansible_env.HOME }}/code/homelab"
          - status
          - --porcelain
      register: homelab_status
      changed_when: false
      check_mode: false
      when: homelab_git_dir.stat.exists

    - name: Explain why the existing checkout will not be updated
      ansible.builtin.debug:
        msg: "Skipping homelab update: this host has local Git changes."
      when:
        - homelab_git_dir.stat.exists
        - (homelab_status.stdout | default('')) != ''

    - name: clone homelab repository
      git:
        repo: git@github.com:bnowakow/homelab.git
        dest: ~/code/homelab/
        clone: yes
        update: yes
      when: not homelab_git_dir.stat.exists or (homelab_status.stdout | default('')) == ''
