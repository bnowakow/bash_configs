# One-off migration: GitHub repository bnowakow/bash_configs -> bnowakow/homelab.
#
# Runbook (repo-rename.sh runs steps 2 and 5 on every inventory):
#   1. Rename the repository on GitHub. This playbook refuses to run until
#      github.com/bnowakow/homelab answers.
#   2. ./repo-rename.sh [--check]
#      On every host this moves ~/code/homelab and
#      /etc/zabbix/zabbix_agent2.d/homelab to .../homelab, leaves the old
#      paths as symlinks, repoints origin, and rewrites references to the old
#      paths in cron (crontabs, /etc/cron.d, TrueNAS cron jobs), systemd units,
#      logrotate, sudoers, Zabbix UserParameter configs, sup's dotfiles and
#      generated (untracked) files in sup's checkout. Services other than
#      zabbix-agent2 are not restarted; the symlinks keep them working.
#   3. utilities/rename-repo-references.sh, review, commit and push.
#   4. Pull the checkouts: git-config_playbook.yml and
#      zabbix-repository-migration_playbook.yml (or zabbix-agent2_playbook.yml),
#      then sup-dotfiles_playbook.yml. Re-run rancher/ansible/site.yml so the
#      Fleet GitRepo uses the new URL (GitHub redirects the old one meanwhile).
#   5. Later: ./repo-rename.sh -e repo_rename_cleanup=true
#      Refuses to continue while a checkout still references the old name,
#      then removes the temporary symlinks.
- name: Rename the bash_configs checkout to homelab
  hosts: all
  become: false
  gather_facts: true
  vars:
    repo_github_owner: bnowakow
    repo_old_name: bash_configs
    repo_new_name: homelab
    repo_rename_cleanup: false
    # Absolute checkout paths only, so unrelated words are left alone.
    # Python syntax for ansible.builtin.replace / the TrueNAS helper ...
    repo_path_regex: '(/code/|/zabbix_agent2\.d/)bash_configs(?![A-Za-z0-9_-])'
    # ... and the same rule for grep -E / sed -E.
    repo_path_ere: '(/code/|/zabbix_agent2\.d/)bash_configs([^A-Za-z0-9_-]|$)'
    repo_path_sed: 's#(/code/|/zabbix_agent2\.d/)bash_configs([^A-Za-z0-9_-]|$)#\1homelab\2#g'

  pre_tasks:
    - name: Confirm that Ansible logs in as sup
      ansible.builtin.assert:
        that: ansible_user_id == 'sup'
        fail_msg: Run this playbook as sup.

    - name: Require the renamed repository on GitHub
      ansible.builtin.command:
        argv:
          - git
          - ls-remote
          - --exit-code
          - "https://github.com/{{ repo_github_owner }}/{{ repo_new_name }}.git"
          - HEAD
      delegate_to: localhost
      run_once: true
      register: rename_github_check
      changed_when: false
      # --check may run before the GitHub rename; a real run may not.
      failed_when: rename_github_check.rc != 0 and not ansible_check_mode
      check_mode: false

    - name: Find sup's home directory
      ansible.builtin.getent:
        database: passwd
        key: sup

  tasks:
    # --- checkouts -------------------------------------------------------

    - name: Move sup's checkout
      ansible.builtin.import_tasks: repo-rename_checkout_tasks.yml
      vars:
        rename_parent: "{{ ansible_facts.getent_passwd['sup'][4] }}/code"
        rename_owner: sup
        rename_remote_url: "git@github.com:{{ repo_github_owner }}/{{ repo_new_name }}.git"
        rename_parent_become: false

    - name: Check for the Zabbix agent directory
      ansible.builtin.stat:
        path: /etc/zabbix/zabbix_agent2.d
      register: rename_zabbix_dir

    - name: Move the Zabbix checkout
      ansible.builtin.import_tasks: repo-rename_checkout_tasks.yml
      vars:
        rename_parent: /etc/zabbix/zabbix_agent2.d
        rename_owner: zabbix
        rename_remote_url: "https://github.com/{{ repo_github_owner }}/{{ repo_new_name }}.git"
        rename_parent_become: true
      when: rename_zabbix_dir.stat.isdir | default(false)

    # --- system files ----------------------------------------------------

    - name: Find system files that reference the old checkout paths
      ansible.builtin.shell: |
        {
          find /etc/systemd/system /etc/cron.d /etc/logrotate.d /etc/sudoers.d -type f 2>/dev/null
          [ -f /etc/crontab ] && echo /etc/crontab
          find /etc/zabbix /etc/zabbix/zabbix_agent2.d -maxdepth 1 -type f -name '*.conf' 2>/dev/null
        } | sort -u | xargs -r -d '\n' grep -lIE '{{ repo_path_ere }}' || true
      args:
        executable: /bin/bash
      become: true
      register: rename_system_files
      changed_when: false
      check_mode: false

    - name: Rewrite old checkout paths in system files
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: "{{ repo_path_regex }}"
        replace: '\1{{ repo_new_name }}'
        validate: "{{ '/usr/sbin/visudo -cf %s' if item is match('/etc/sudoers') else omit }}"
      become: true
      loop: "{{ rename_system_files.stdout_lines }}"
      register: rename_system_rewrites

    - name: Reload systemd after unit changes
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      when: >-
        rename_system_rewrites.results | default([]) | selectattr('changed')
        | map(attribute='item') | select('match', '/etc/systemd/') | list | length > 0

    - name: List units that will use the new path after their next restart
      ansible.builtin.debug:
        msg: >-
          Not restarted (the old path still works through the symlink):
          {{ rename_system_rewrites.results | selectattr('changed') | map(attribute='item')
             | select('match', '/etc/systemd/') | map('basename') | join(', ') }}
      when: >-
        rename_system_rewrites.results | default([]) | selectattr('changed')
        | map(attribute='item') | select('match', '/etc/systemd/') | list | length > 0

    - name: Restart zabbix-agent2 after UserParameter changes
      ansible.builtin.service:
        name: zabbix-agent2
        state: restarted
      become: true
      when: >-
        rename_system_rewrites.results | default([]) | selectattr('changed')
        | map(attribute='item') | select('match', '/etc/zabbix/') | list | length > 0

    # --- crontabs ----------------------------------------------------------

    - name: Find user crontabs that reference the old checkout paths
      ansible.builtin.shell: |
        for file in /var/spool/cron/crontabs/*; do
          if [ -f "$file" ] && grep -qE '{{ repo_path_ere }}' "$file"; then
            basename "$file"
          fi
        done
      args:
        executable: /bin/bash
      become: true
      register: rename_crontab_users
      changed_when: false
      check_mode: false

    - name: Rewrite those crontabs through crontab(1)
      ansible.builtin.shell: |
        set -o pipefail
        crontab -u '{{ item }}' -l | sed -E '{{ repo_path_sed }}' | crontab -u '{{ item }}' -
      args:
        executable: /bin/bash
      become: true
      loop: "{{ rename_crontab_users.stdout_lines }}"

    - name: Rewrite TrueNAS cron jobs and init/shutdown scripts
      ansible.builtin.command:
        argv:
          - python3
          - -I
          - -c
          - |
            import json, os, re, subprocess, sys
            apply = sys.argv[1] == "apply"
            rx = re.compile(sys.argv[2])
            for namespace, field in (("cronjob", "command"),
                                     ("initshutdownscript", "command"),
                                     ("initshutdownscript", "script")):
                items = json.loads(subprocess.check_output(["midclt", "call", namespace + ".query"]))
                for item in items:
                    value = item.get(field) or ""
                    new_value = rx.sub(r"\g<1>" + sys.argv[3], value)
                    if new_value == value:
                        continue
                    # TrueNAS refuses a script path that does not exist; such
                    # an entry was already broken before the rename.
                    if field == "script" and not os.path.exists(new_value):
                        print("skipped %s %s: script missing, fix or delete it in the UI: %s"
                              % (namespace, item["id"], new_value), file=sys.stderr)
                        continue
                    if apply:
                        subprocess.check_call(["midclt", "call", namespace + ".update",
                                               str(item["id"]), json.dumps({field: new_value})],
                                              stdout=subprocess.DEVNULL)
                    print("%s %s: %s" % (namespace, item["id"], new_value))
          - "{{ 'check' if ansible_check_mode else 'apply' }}"
          - "{{ repo_path_regex }}"
          - "{{ repo_new_name }}"
      become: true
      register: rename_truenas
      changed_when: rename_truenas.stdout != ''
      check_mode: false
      when: ansible_hostname == 'nas'

    - name: Report TrueNAS entries that point at missing scripts
      ansible.builtin.debug:
        msg: "{{ rename_truenas.stderr_lines }}"
      when:
        - ansible_hostname == 'nas'
        - rename_truenas.stderr | default('') != ''

    # --- sup's files ---------------------------------------------------------

    - name: Find sup's dotfiles and generated checkout files with old paths
      ansible.builtin.shell: |
        home={{ ansible_facts.getent_passwd['sup'][4] | quote }}
        checkout="$home/code/{{ repo_new_name }}"
        {
          for file in .screenrc .zshrc .zprofile .zpreztorc .bashrc .profile; do
            [ -f "$home/$file" ] && printf '%s\n' "$home/$file"
          done
          # Untracked/ignored files rendered from templates, e.g. traefik.yml.
          if [ -d "$checkout/.git" ]; then
            {
              git -C "$checkout" ls-files --others --exclude-standard -- . ':(exclude)repos'
              git -C "$checkout" ls-files --others --ignored --exclude-standard -- . ':(exclude)repos'
            } | grep -E '\.(ya?ml|conf|service|sh|toml|json|env)$' | grep -vE '(^|/)logs/' \
              | sed "s#^#$checkout/#"
          fi
        } | sort -u | xargs -r -d '\n' grep -lIE '{{ repo_path_ere }}' || true
      args:
        executable: /bin/bash
      register: rename_sup_files
      changed_when: false
      check_mode: false

    - name: Rewrite old checkout paths in sup's files
      ansible.builtin.replace:
        path: "{{ item }}"
        regexp: "{{ repo_path_regex }}"
        replace: '\1{{ repo_new_name }}'
      # Some generated files are root-owned (e.g. transmission's traefik.yml
      # in a root-owned directory); replace keeps each file's owner and mode.
      become: true
      loop: "{{ rename_sup_files.stdout_lines }}"

    # --- verification ----------------------------------------------------------

    - name: Check that every Zabbix UserParameter script exists at its new path
      ansible.builtin.shell: |
        grep -hoE '/etc/zabbix/zabbix_agent2\.d/{{ repo_new_name }}/[^ ,"]+' /etc/zabbix/zabbix_agent2.d/*.conf 2>/dev/null \
          | sort -u | while IFS= read -r path; do
              [ -e "$path" ] || printf 'missing: %s\n' "$path"
            done
      args:
        executable: /bin/bash
      become: true
      register: rename_zabbix_missing
      changed_when: false
      failed_when: rename_zabbix_missing.stdout != ''
      when:
        - rename_zabbix_dir.stat.isdir | default(false)
        - not ansible_check_mode
