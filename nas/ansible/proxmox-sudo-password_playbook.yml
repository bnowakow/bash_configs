- name: Require a password for sup's sudo on proxmox5
  hosts: proxmox5.localdomain.bnowakowski.pl
  remote_user: sup
  gather_facts: false

  pre_tasks:
    - name: Refuse the NAS-local inventory
      ansible.builtin.assert:
        that: not (nas_local_inventory | default(false) | bool)
        fail_msg: This playbook must not run with inventory/nas-local.yml.
      tags: always

    - name: Identify the target before changing it
      ansible.builtin.setup:
      tags: always

    - name: Refuse to change NAS
      ansible.builtin.assert:
        that: ansible_hostname != 'nas'
        fail_msg: This playbook must not change NAS.
      tags: always

  tasks:
    - name: Check that sup has an active password
      ansible.builtin.command: passwd -S sup
      become: true
      register: sup_password_status
      changed_when: false
      check_mode: false

    - name: Check sup's groups
      ansible.builtin.command: id -nG sup
      register: sup_groups
      changed_when: false
      check_mode: false

    - name: Refuse to remove passwordless sudo unless sup can use password-based sudo
      ansible.builtin.assert:
        that:
          - sup_password_status.stdout.split()[1] == 'P'
          - "'sudo' in sup_groups.stdout.split()"
        fail_msg: Set an active password for sup and ensure it belongs to the sudo group first.

    - name: Require sup's password for sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/90-sup-ansible
        content: "sup ALL=(ALL:ALL) ALL\n"
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
      become: true
