- hosts: all
  become: true
  become_method: sudo
  gather_facts: false
  vars:
    zabbix_version: 7.0
  pre_tasks:
    - name: Refuse the NAS-local inventory for VM setup
      ansible.builtin.assert:
        that: not (nas_local_inventory | default(false) | bool)
        fail_msg: This playbook must not run with inventory/nas-local.yml.
      become: false
      tags: always
    - name: Gather facts after the inventory safeguard
      ansible.builtin.setup:
      tags: always
    - name: refresh apt package lists
      ansible.builtin.apt:
        update_cache: true
      tags: zabbix_package
    - name: check zabbix apt repository
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/zabbix.list
      register: zabbix_apt_repository
      tags: zabbix_package
    - name: check whether zabbix-agent2 is available from current apt sources
      ansible.builtin.command: apt-cache show zabbix-agent2
      register: zabbix_agent2_package
      changed_when: false
      failed_when: false
      check_mode: false
      tags: zabbix_package
    - name: install zabbix-agent2 from current apt sources
      ansible.builtin.apt:
        name: zabbix-agent2
        state: present
      when:
        - zabbix_agent2_package.rc == 0
        - not zabbix_apt_repository.stat.exists
      tags: zabbix_package
    - name: install zabbix release package
      ansible.builtin.shell: |
        set -e
        curl -fsSL -o /tmp/zabbix-release.deb "https://repo.zabbix.com/zabbix/{{ zabbix_version }}/{{ ansible_distribution | lower }}/pool/main/z/zabbix-release/zabbix-release_latest_{{ zabbix_version }}+{{ ansible_distribution | lower }}{{ ansible_distribution_major_version }}_all.deb"
        apt-get install -y /tmp/zabbix-release.deb
      when:
        - zabbix_agent2_package.rc != 0
        - not zabbix_apt_repository.stat.exists
      tags: zabbix_package
  roles:
    - role: revenni.zabbix_agent2
      when: zabbix_agent2_package.rc != 0 or zabbix_apt_repository.stat.exists
      tags:
        - zabbix_agent2
        - zabbix_package
    
  tasks:
    - name: Creating a symlink
      ansible.builtin.file:
        src: "/home/sup/code/bash_configs"
        dest: "/etc/zabbix/zabbix_agent2.d/bash_configs"
        state: link
    - name: copy zabbix-agent2 config
      ansible.builtin.copy:
        src: /etc/zabbix/zabbix_agent2.d/bash_configs/zabbix/zabbix_agent2.conf
        dest: /etc/zabbix/zabbix_agent2.conf
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      notify: restart zabbix-agent2 after config changes
    - name: check whether zabbix sudoers rules already exist
      ansible.builtin.command: grep -R -qF 'Cmnd_Alias ZABBIX_CMD=' /etc/sudoers /etc/sudoers.d
      register: zabbix_sudoers_rules
      changed_when: false
      failed_when: zabbix_sudoers_rules.rc not in [0, 1]
      check_mode: false
    - name: install zabbix sudoers rules
      ansible.builtin.copy:
        src: ../zabbix-sudoers
        dest: /etc/sudoers.d/zabbix
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
      when: zabbix_sudoers_rules.rc == 1
    - name: check zabbix account settings
      ansible.builtin.command: getent passwd zabbix
      register: zabbix_account
      changed_when: false
      check_mode: false
      tags: zabbix_access
    - name: check zabbix group membership
      ansible.builtin.command: id -nG zabbix
      register: zabbix_groups
      changed_when: false
      check_mode: false
      tags: zabbix_access
    - name: update zabbix account while its service is stopped
      when: >-
        zabbix_account.stdout.split(':')[5] != '/home/zabbix' or
        zabbix_account.stdout.split(':')[6] != '/bin/bash' or
        'sup' not in zabbix_groups.stdout.split()
      tags: zabbix_access
      block:
        - name: stop zabbix-agent2 before changing its account
          ansible.builtin.service:
            name: zabbix-agent2
            state: stopped
        - name: configure zabbix account
          ansible.builtin.user:
            name: zabbix
            groups: sup
            append: true
            home: /home/zabbix
            create_home: true
            shell: /bin/bash
      always:
        - name: start zabbix-agent2 after changing its account
          ansible.builtin.service:
            name: zabbix-agent2
            state: started
    - name: ensure zabbix home exists
      ansible.builtin.file:
        path: /home/zabbix
        state: directory
        owner: zabbix
        group: zabbix
        mode: '0750'
      tags: zabbix_access
    - name: allow zabbix to access sup's home
      ansible.builtin.file:
        path: /home/sup
        state: directory
        mode: '0750'
      tags: zabbix_access
    - name: create zabbix repository directory
      ansible.builtin.file:
        path: /home/sup/code/bash_configs/zabbix/repos
        state: directory
        owner: zabbix
        group: zabbix
        mode: '0755'
      tags: zabbix_access
    - name: Find Zabbix metadata configs in the remote checkout
      ansible.builtin.command:
        argv:
          - find
          - -L
          - /etc/zabbix/zabbix_agent2.d/bash_configs
          - -type
          - f
          - -name
          - 'zabbix*.conf'
          - '!'
          - -name
          - zabbix_agent2.conf
          - -print
      register: zabbix_metadata_sources
      changed_when: false
      check_mode: false

    - name: Require unique Zabbix metadata config names
      ansible.builtin.assert:
        that:
          - >-
            zabbix_metadata_sources.stdout_lines | map('basename') | list | length ==
            zabbix_metadata_sources.stdout_lines | map('basename') | unique | list | length

    - name: Copy Zabbix metadata configs from the remote checkout
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/etc/zabbix/zabbix_agent2.d/{{ item | basename }}"
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      loop: "{{ zabbix_metadata_sources.stdout_lines }}"
      notify: restart zabbix-agent2 after config changes

    - name: Find installed Zabbix metadata configs
      ansible.builtin.find:
        paths: /etc/zabbix/zabbix_agent2.d
        patterns: 'zabbix*.conf'
        recurse: false
        file_type: file
      register: zabbix_metadata_installed

    - name: Remove obsolete Zabbix metadata configs
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ zabbix_metadata_installed.files }}"
      loop_control:
        label: "{{ item.path }}"
      when: >-
        item.path | basename not in
        (zabbix_metadata_sources.stdout_lines | map('basename') | list)
      notify: restart zabbix-agent2 after config changes

    - name: Keep zabbix-agent2 enabled and running
      ansible.builtin.service:
        name: zabbix-agent2
        enabled: true
        state: started

  handlers:
    - name: restart zabbix-agent2 after config changes
      ansible.builtin.service:
        name: zabbix-agent2
        state: restarted
