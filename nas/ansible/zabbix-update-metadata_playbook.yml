- name: Update Zabbix metadata from the checked-out repository
  hosts: all
  become: true
  become_method: sudo
  gather_facts: false
  tasks:
    - name: Run the Zabbix metadata update script with readable file permissions
      ansible.builtin.shell: |
        umask 022
        exec /etc/zabbix/zabbix_agent2.d/bash_configs/zabbix/update-zabbix-metadata.sh
