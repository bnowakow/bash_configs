# Temporary, delete after the repo rename cleanup.
#
# Restarts the systemd services whose processes were started from the old
# bash_configs path (they work only through the temporary symlink). Their unit
# files were already rewritten by repo-rename_playbook.yml, so after a restart
# they run from .../homelab. Processes outside a system service (e.g. a shell
# in a screen session) are only reported, never killed.
#
#   ./repo-rename-restart.sh --check   # list what would be restarted
#   ./repo-rename-restart.sh           # restart
- name: Restart services still running from the old bash_configs path
  hosts: all
  become: true
  gather_facts: false
  vars:
    # [g] keeps the pattern from matching the shell that runs pgrep.
    old_path_pattern: '/bash_confi[g]s/'

  tasks:
    # Prints "unit <name>" for a system service to restart, or "other <unit>
    # <args>" for anything else (user sessions, screen, no unit).
    - name: Find the systemd units of processes using the old path
      ansible.builtin.shell: |
        for pid in $(pgrep -f '{{ old_path_pattern }}'); do
          unit=$(ps -o unit= -p "$pid" 2>/dev/null | tr -d ' ')
          case "$unit" in
            user@*|session-*) echo "other $unit $(ps -o args= -p "$pid")" ;;
            *.service) echo "unit $unit" ;;
            *) echo "other ${unit:--} $(ps -o args= -p "$pid")" ;;
          esac
        done | sort -u
      args:
        executable: /bin/bash
      register: old_path_processes
      changed_when: false
      check_mode: false

    - name: Split them into restartable services and everything else
      ansible.builtin.set_fact:
        old_path_units: >-
          {{ old_path_processes.stdout_lines | select('match', 'unit ')
             | map('regex_replace', '^unit ', '') | list }}
        old_path_other: >-
          {{ old_path_processes.stdout_lines | select('match', 'other ')
             | map('regex_replace', '^other ', '') | list }}

    - name: Show what was found
      ansible.builtin.debug:
        msg:
          restart: "{{ old_path_units }}"
          not_a_service_left_alone: "{{ old_path_other }}"

    - name: Restart the services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop: "{{ old_path_units }}"

    - name: Check that nothing restarted still uses the old path
      ansible.builtin.shell: |
        for pid in $(pgrep -f '{{ old_path_pattern }}'); do
          ps -o unit= -p "$pid" | tr -d ' '
        done | sort -u
      args:
        executable: /bin/bash
      register: old_path_after
      changed_when: false
      failed_when: old_path_after.stdout_lines | intersect(old_path_units) | length > 0
      when:
        - old_path_units | length > 0
        - not ansible_check_mode

    - name: Check the restarted services are active
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop: "{{ old_path_units }}"
      changed_when: false
      when: not ansible_check_mode
